# .github/workflows/backend.yml
# Construye la imagen del backend en cualquier rama.
# Solo la publica en ghcr.io con push o merge a main.
name: Backend

on:
  push:
    branches: ["**"]          # cualquier rama
    paths: ["ServicesBackend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["ServicesBackend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:          # permite ejecutarlo a mano desde GitHub

jobs:
  imagen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # permiso para publicar en ghcr.io
    env:
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Iniciar sesión en ghcr.io
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre de la imagen (en minúsculas)
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_ENV"

      - name: Construir (y publicar solo en main)
        uses: docker/build-push-action@v6
        with:
          context: ./ServicesBackend
          push: ${{ env.PUBLICAR == 'true' }}
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}