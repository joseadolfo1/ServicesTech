# NIVEL 2 · Base de datos + backend
# Uso:  docker compose -f nivel2-db-backend.yml up -d --build
# En tu PC corres: frontend (opcional)
include:
  - nivel1-db.yml            # trae el servicio "db" tal como está en el nivel 1

services:
  backend:
    build: 
      context: ./ServicesBackend         # carpeta donde está el Dockerfile del backend
      platforms: [linux/amd64, linux/arm64]
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/servicetechdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy   # espera a que la base esté lista
