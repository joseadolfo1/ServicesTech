spring.application.name=servicesbackend
server.port=${PORT:8080}

#DATABASE
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/servicetechdb?socketTimeout=15}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

jwt.secret=${JWT_SECRET:5367566859703373367639792F423F452848284D6251655468576D5A71347437}

spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.minimum-idle=1

spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=validate

#Migration configuration
spring.flyway.enabled=true
spring.flyway.baseline-version=1
spring.flyway.schemas=public
spring.flyway.locations=classpath:db/migration
spring.flyway.sql-migration-prefix=V
spring.flyway.sql-migration-suffixes=.sql
spring.flyway.baseline-on-migrate=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
